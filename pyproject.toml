[project]
name = "repoguide"
version = "0.1.0"
description = "Repository intelligence and grounded codebase Q&A"
readme = "README.md"
authors = [
    { name = "Nikhil Reddy", email = "nikhilreddy.maligireddy2@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "boto3>=1.40,<2",
    "mangum>=0.19,<1",
    "fastapi>=0.143.0",
    "google-genai>=2.29.0",
    "httpx>=0.28.1",
    "langgraph>=1,<2",
    "mlflow>=3.17,<4",
    "mcp>=2,<3",
    "openai>=3.35.1",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.1.4",
    "tree-sitter==0.25.2",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "uvicorn[standard]>=0.54.0",
    "torch>=2.8",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "psutil>=6.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true