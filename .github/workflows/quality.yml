name: RepoGuide quality
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  fast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install locked environment
        run: uv sync --dev
      - name: Lint
        env:
          DATABASE_URL: postgresql+psycopg://repoguide:repoguide@localhost:5432/repoguide
          MLFLOW_ENABLED: "false"
        run: uv run ruff check src/repoguide/telemetry.py src/repoguide/router.py src/repoguide/workflow.py src/repoguide/pipeline.py src/repoguide/api.py evals/quality_metrics.py
      - name: Deterministic tests
        env:
          DATABASE_URL: postgresql+psycopg://repoguide:repoguide@localhost:5432/repoguide
          MLFLOW_ENABLED: "false"
        run: uv run pytest tests/test_m6_pure.py tests/test_api.py -q
# Full PostgreSQL + live LLM judges are separate explicit gated workflows.
