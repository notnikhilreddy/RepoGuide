name: M8 Build and push immutable images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docker/Dockerfile.lambda'
      - 'docker/Dockerfile.worker'
      - 'pyproject.toml'
      - 'uv.lock'
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    if: ${{ vars.AWS_ECR_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: ECR login
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          PROJECT: ${{ vars.AWS_PROJECT }}
        run: |
          chmod +x scripts/aws_build_push.sh
          ./scripts/aws_build_push.sh
# Deliberately no automatic Terraform apply: infrastructure updates need review.
