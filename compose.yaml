services:
  db:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    container_name: repoguide-db

    environment:
      POSTGRES_DB: repoguide
      POSTGRES_USER: repoguide
      POSTGRES_PASSWORD: repoguide

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repoguide -d repoguide"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
